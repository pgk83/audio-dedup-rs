[package]
name = "audio-dedup"
version = "0.1.0"
edition = "2021"
authors = ["pgk83"]
description = "Ultra-fast parallel audio scanner, metadata reader and acoustic deduplicator in static Rust"

[dependencies]
rayon = "1.10"
walkdir = "2.5"
lofty = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
